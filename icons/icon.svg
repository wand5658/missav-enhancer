      <stop offset="0" stop-color="#88c0d0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#81a1c1" stop-opacity=".55"/>
      <stop offset=".8" stop-color="#b48ead" stop-opacity=".25"/>
      <stop offset="1" stop-color="#b48ead" stop-opacity="0"/>
