# Push a tag matching manifest.json's version (e.g. v1.5) to publish a release
# with a zip that can be loaded unpacked.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Build zip
        run: |
          dir="missav-enhancer-$GITHUB_REF_NAME"
          mkdir "$dir"
          cp manifest.json *.js *.css popup.html LICENSE "$dir/"
          mkdir "$dir/icons" && cp icons/*.png "$dir/icons/"
          zip -r "$dir.zip" "$dir"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "missav-enhancer-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
